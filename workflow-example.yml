# Usage: copy to .github/workflows/reviewer-recommend.yml of the target repository and commit
# it to the default branch: pull_request_target only fires for a workflow file that lives
# there. See "Usage as a GitHub Action" in README.md.
name: reviewer-recommend

on:
  pull_request_target:
    types: [opened, ready_for_review]
    # To run again when the PR gets new commits, add synchronize: the comment is edited in
    # place, and reviewers who were already requested stay requested.

permissions:
  contents: read
  pull-requests: write

jobs:
  recommend:
    # Drafts wait until they are marked ready for review (the ready_for_review event).
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # Remote action: replace OWNER with the repository owner and pin the full commit SHA.
      # The action checks out the PR's base commit (full history) itself. Nothing from the
      # PR is checked out or run.
      - uses: OWNER/pr-reviewer-recommender@FULL_COMMIT_SHA
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # top-n: '3'                  # how many reviewers to recommend and request (at least 2)
          # request-reviewers: 'false'  # post the comment only
          # dry-run: 'true'             # print to the log only; write nothing

      # Vendored form (action.yml, reviewer_recommender/ and LICENSE copied to
      # .github/actions/reviewer-recommender/): use these two steps instead. The local action
      # is read from the PR's base commit, so the directory has to exist on the base branch.
      # The job holds a write token, so pin actions/checkout to a commit SHA here as well.
      # - uses: actions/checkout@v4
      #   with:
      #     ref: ${{ github.event.pull_request.base.sha }}
      #     fetch-depth: 0
      #     persist-credentials: false
      # - uses: ./.github/actions/reviewer-recommender
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
